{% extends "booking/base.html" %}
{% block title %}Login - LorryGo{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to book your lorry</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{% url 'booking:register' %}">Register here</a></p>
    <p class="auth-switch" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);color:var(--slate);font-size:0.85rem;">
        Own lorries? <a href="{% url 'booking:owner_login' %}">Owner login</a> &middot;
        Drive for a fleet? <a href="{% url 'booking:driver_login' %}">Driver login</a> &middot;
        <a href="{% url 'booking:admin_login' %}">Admin panel</a>
    </p>
</div>
{% endblock %}
