{% extends "booking/base.html" %}
{% block title %}Owner Login - LorryGo{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Lorry Owner Login</h1>
    <p class="subtitle">Manage your vehicles and trip requests</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
    <p class="auth-switch">New here? <a href="{% url 'booking:owner_register' %}">Register your fleet</a></p>
    <p class="auth-switch"><a href="{% url 'booking:login' %}">&larr; Back to customer login</a></p>
</div>
{% endblock %}
